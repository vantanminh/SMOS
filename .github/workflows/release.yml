name: Release

# Auto-publish a GitHub Release (prebuilt tarball) on every push to main.
# Manual version tags (v1.2.3) still work; auto tags look like v0.1.0-build.42
# so they do not re-trigger this workflow (see job if:).

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Optional release tag (e.g. v0.1.0). Empty = auto v<cargo>-build.<run>."
        required: false
        default: ""

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-linux:
    name: Build Linux release assets
    runs-on: ubuntu-latest
    # Skip re-entry when a previous run created an auto tag v*-build.N
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.ref == 'refs/heads/main' ||
      (startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-build.'))
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
    outputs:
      version: ${{ steps.meta.outputs.ver }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version label
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          CARGO_VER="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n1)"
          if [[ -z "$CARGO_VER" ]]; then
            CARGO_VER="0.0.0"
          fi
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            VER="${{ github.ref_name }}"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ inputs.tag }}" ]]; then
            VER="${{ inputs.tag }}"
          else
            # Auto release for main (and empty dispatch): unique, installable tag
            VER="v${CARGO_VER}-build.${{ github.run_number }}"
          fi
          echo "ver=${VER}" >> "$GITHUB_OUTPUT"
          echo "cargo_ver=${CARGO_VER}" >> "$GITHUB_OUTPUT"
          echo "Resolved release version: ${VER}"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }} --locked

      - name: Package tarball
        id: pack
        shell: bash
        run: |
          set -euo pipefail
          TARGET="${{ matrix.target }}"
          VER="${{ steps.meta.outputs.ver }}"
          STAGE="smos-${VER}-${TARGET}"
          mkdir -p "dist/${STAGE}"
          cp "target/${TARGET}/release/smos" "dist/${STAGE}/smos"
          chmod 755 "dist/${STAGE}/smos"
          cp -a static "dist/${STAGE}/static"
          (cd "dist/${STAGE}" && sha256sum smos > smos.sha256)
          TAR_NAME="${STAGE}.tar.gz"
          tar -C dist -czf "${TAR_NAME}" "${STAGE}"
          sha256sum "${TAR_NAME}" > "${TAR_NAME}.sha256"
          echo "tar_name=${TAR_NAME}" >> "$GITHUB_OUTPUT"
          ls -la "${TAR_NAME}" "${TAR_NAME}.sha256"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: smos-${{ matrix.target }}
          path: |
            smos-*.tar.gz
            smos-*.tar.gz.sha256

  publish:
    name: Publish GitHub Release
    needs: build-linux
    runs-on: ubuntu-latest
    if: needs.build-linux.result == 'success'
    steps:
      - name: Download assets
        uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: List assets
        run: find assets -type f -ls || ls -laR assets

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build-linux.outputs.version }}
          name: SMOS ${{ needs.build-linux.outputs.version }}
          # Latest successful main build is always "latest" for install.sh
          make_latest: true
          generate_release_notes: true
          body: |
            Automated release from CI.

            Install on a Linux server (no compile):

            ```bash
            curl -fsSL https://raw.githubusercontent.com/vantanminh/SMOS/main/scripts/install.sh | bash
            ```

            Pin this build:

            ```bash
            curl -fsSL https://raw.githubusercontent.com/vantanminh/SMOS/main/scripts/install.sh | SMOS_VERSION=${{ needs.build-linux.outputs.version }} bash
            ```
          files: |
            assets/*.tar.gz
            assets/*.sha256
            assets/**/*.tar.gz
            assets/**/*.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
