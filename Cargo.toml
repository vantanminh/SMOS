[package]
name = "smos"
version = "0.1.0"
edition = "2021"
description = "SMOS — Server Management OS: host metrics, processes, logs, config, and audit dashboard"
license = "MIT"
authors = ["SMOS Contributors"]

[dependencies]
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "cors", "trace", "set-header"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
sysinfo = "0.35"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
uuid = { version = "1", features = ["v4", "serde"] }
mime_guess = "2"
parking_lot = "0.12"
bytes = "1"
argon2 = "0.5.3"
totp-rs = { version = "5.7.2", features = ["otpauth", "gen_secret"] }
data-encoding = "2.11.1"
getrandom = "0.3"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[[bin]]
name = "smos"
path = "src/main.rs"

[lib]
name = "smos"
path = "src/lib.rs"
